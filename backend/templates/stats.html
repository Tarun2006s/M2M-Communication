<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2M Server Stats</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155; }
    header h1 { margin: 0; font-size: 1.4rem; color: #38bdf8; }
    main { padding: 1.5rem 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.25rem; }
    .card h2 { margin: 0 0 1rem; font-size: 1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; }
    .stat { display: flex; justify-content: space-between; padding: 0.4rem 0; border-top: 1px solid #334155; font-size: 0.9rem; }
    .stat:first-of-type { border-top: none; }
    .val { font-weight: 700; color: #38bdf8; }
    .wide { grid-column: 1 / -1; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 0.75rem; color: #64748b; padding: 0.4rem 0.5rem; border-bottom: 1px solid #334155; }
    tbody td { padding: 0.4rem 0.5rem; font-size: 0.85rem; }
    #refresh { color: #64748b; font-size: 0.75rem; padding: 1rem 2rem; }
  </style>
</head>
<body>
  <header><h1>📊 M2M Server Stats</h1></header>
  <main id="main">Loading…</main>
  <div id="refresh"></div>

  <script>
    async function load() {
      const resp = await fetch('/api/stats');
      if (!resp.ok) { document.getElementById('main').textContent = 'Failed to load stats.'; return; }
      const s = await resp.json();

      const endpointRows = Object.entries(s.requests_per_endpoint || {})
        .sort((a, b) => b[1] - a[1])
        .map(([ep, n]) => `<tr><td>${ep}</td><td>${n}</td></tr>`)
        .join('') || '<tr><td colspan="2">—</td></tr>';

      const deviceRows = Object.entries(s.connected_devices || {})
        .sort()
        .map(([id, d]) => `<tr><td>${id}</td><td>${d.last_seen || '—'}</td><td>${d.last_message_type || '—'}</td><td>${d.message_count || 0}</td></tr>`)
        .join('') || '<tr><td colspan="4">—</td></tr>';

      document.getElementById('main').innerHTML = `
        <div class="card">
          <h2>HTTP Requests</h2>
          <div class="stat"><span>Total</span><span class="val">${s.total_requests}</span></div>
          <div class="stat"><span>Uptime</span><span class="val">${Math.round(s.uptime_seconds)}s</span></div>
        </div>
        <div class="card">
          <h2>Messages</h2>
          <div class="stat"><span>Received</span><span class="val">${s.messages_received}</span></div>
          <div class="stat"><span>Validated</span><span class="val">${s.messages_validated}</span></div>
          <div class="stat"><span>Rejected</span><span class="val">${s.messages_rejected}</span></div>
        </div>
        <div class="card">
          <h2>WebSocket</h2>
          <div class="stat"><span>Current connections</span><span class="val">${s.ws_connections_current}</span></div>
          <div class="stat"><span>Total connections</span><span class="val">${s.ws_connections_total}</span></div>
        </div>
        <div class="card wide">
          <h2>Requests per Endpoint</h2>
          <table><thead><tr><th>Endpoint</th><th>Count</th></tr></thead>
          <tbody>${endpointRows}</tbody></table>
        </div>
        <div class="card wide">
          <h2>Connected Devices</h2>
          <table><thead><tr><th>Device ID</th><th>Last Seen</th><th>Last Type</th><th>Messages</th></tr></thead>
          <tbody>${deviceRows}</tbody></table>
        </div>`;
      document.getElementById('refresh').textContent = 'Last refreshed: ' + new Date().toLocaleTimeString();
    }

    load();
    setInterval(load, 10_000);
  </script>
</body>
</html>
